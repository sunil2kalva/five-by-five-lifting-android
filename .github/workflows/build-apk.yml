name: Build Five By Five Lifting Android APK & Release AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Ensure Persistent Android Debug Signing Keystore & Export SHA-1
        run: |
          mkdir -p app/signing
          if [ ! -f app/signing/fivebyfive.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/signing/fivebyfive.keystore \
              -storetype PKCS12 \
              -alias fivebyfive \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass fivebyfive123 \
              -keypass fivebyfive123 \
              -dname "CN=Five By Five Lifting, OU=Mobile, O=FiveByFiveLifting, L=SanJose, ST=CA, C=US"
          fi
          keytool -list -v \
            -keystore app/signing/fivebyfive.keystore \
            -alias fivebyfive \
            -storepass fivebyfive123 > app/signing/signing-info.txt
          cat app/signing/signing-info.txt

      - name: Decode Optional Play Store Upload Keystore (Secrets)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
            echo "Play Store upload keystore decoded into runner temp directory."
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret configured; release AAB will use preview signing."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Run Unit Tests, Assemble Debug APK & Bundle Minified Release AAB
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle testDebugUnitTest assembleDebug bundleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk FiveByFiveLifting-s26plus-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab FiveByFiveLifting-release.aab

      - name: Upload APK, Release AAB & Signing Info Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FiveByFiveLifting-s26plus-debug-apk
          path: |
            FiveByFiveLifting-s26plus-debug.apk
            FiveByFiveLifting-release.aab
            app/signing/fivebyfive.keystore
            app/signing/signing-info.txt

      - name: Publish Release (v1.9.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.0
          name: "Five By Five Lifting Android v1.9.0 (Play Store Ready: API 36, Adaptive Icon, Health Connect 1.1.0 & Release AAB)"
          body: "Signed debug APK for Galaxy S26+ plus minified release AAB (targetSdk 36 / Android 16). Features adaptive launcher + monochrome themed icons, Health Connect 1.1.0 stable (write-only WRITE_EXERCISE compliance), in-app privacy policy rationale dialog, edge-to-edge dark system bars, and CI-verified R8 release app bundle."
          files: |
            FiveByFiveLifting-s26plus-debug.apk
            FiveByFiveLifting-release.aab
            app/signing/signing-info.txt
          prerelease: false
