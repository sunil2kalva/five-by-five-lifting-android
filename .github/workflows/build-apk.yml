name: Build Five By Five Lifting Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Android Signing Keystore & Export SHA-1
        run: |
          mkdir -p app/signing
          if [ ! -f app/signing/fivebyfive.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/signing/fivebyfive.keystore \
              -storetype PKCS12 \
              -alias fivebyfive \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass fivebyfive123 \
              -keypass fivebyfive123 \
              -dname "CN=Five By Five Lifting, OU=Mobile, O=FiveByFiveLifting, L=SanJose, ST=CA, C=US"
          fi
          keytool -list -v \
            -keystore app/signing/fivebyfive.keystore \
            -alias fivebyfive \
            -storepass fivebyfive123 > app/signing/signing-info.txt
          cat app/signing/signing-info.txt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests & Assemble Signed Debug APK
        run: |
          gradle testDebugUnitTest assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk FiveByFiveLifting-s26plus-debug.apk

      - name: Upload APK & Signing Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FiveByFiveLifting-s26plus-debug-apk
          path: |
            FiveByFiveLifting-s26plus-debug.apk
            app/signing/fivebyfive.keystore
            app/signing/signing-info.txt

      - name: Publish APK to GitHub Releases (v1.5.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          name: "Five By Five Lifting Android v1.5.0 (Native Sign in with Google)"
          body: "Signed debug APK for Samsung S26+. Adds native Google Sign-In via Google Play Services Auth configured with GCP OAuth 2.0 Client ID and signed with the persistent project keystore."
          files: |
            FiveByFiveLifting-s26plus-debug.apk
            app/signing/signing-info.txt
          prerelease: false
