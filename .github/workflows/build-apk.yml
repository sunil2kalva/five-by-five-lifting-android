name: Build Five By Five Lifting Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests & Assemble Debug APK
        run: |
          gradle testDebugUnitTest assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk FiveByFiveLifting-s26plus-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FiveByFiveLifting-s26plus-debug-apk
          path: FiveByFiveLifting-s26plus-debug.apk

      - name: Publish APK to GitHub Releases (v1.4.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: "Five By Five Lifting Android v1.4.0 (Full Rebrand to Five By Five Lifting)"
          body: "Signed debug APK for Samsung S26+. Rebrands app name, package namespace (com.fivebyfivelifting.app), database, and backup identifiers to Five By Five Lifting."
          files: FiveByFiveLifting-s26plus-debug.apk
          prerelease: false
