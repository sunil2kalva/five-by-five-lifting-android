name: Build StrongLifts 5x5 Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests & Assemble Debug APK
        run: |
          gradle testDebugUnitTest assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk StrongLifts5x5-s26plus-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrongLifts5x5-s26plus-debug-apk
          path: StrongLifts5x5-s26plus-debug.apk

      - name: Publish APK to GitHub Releases (v1.3.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "StrongLifts 5x5 Android v1.3.0 (Clear Google Drive Backup Status & Simplified Settings)"
          body: "Signed debug APK for Samsung S26+. Redesigns Settings Google Drive Backup card to clearly display Configured Status (Google User + Backup File + Change options), removes Link Drive Auto-Sync File, and only shows Restore/Merge when backup/sync is not configured."
          files: StrongLifts5x5-s26plus-debug.apk
          prerelease: false
