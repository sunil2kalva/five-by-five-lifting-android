<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Five By Five Lifting</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <style>
:root {
  --bg: #0f172a;
  --surface: #1e293b;
  --card: #26334d;
  --border: #334155;
  --text: #f8fafc;
  --muted: #94a3b8;
  --primary: #ef4444;
  --primary-dark: #b91c1c;
  --blue: #3b82f6;
  --emerald: #10b981;
  --amber: #f59e0b;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  padding: 0;
  background-color: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  user-select: none;
  overscroll-behavior-y: none;
}

.app-shell {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding-bottom: 84px;
}

header.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 16px 8px;
}

header.top-bar h1 {
  margin: 0;
  font-size: 1.45rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}

header.top-bar p {
  margin: 2px 0 0;
  font-size: 0.78rem;
  color: var(--muted);
}

.sync-pill {
  background: rgba(16, 185, 129, 0.14);
  border: 1px solid rgba(16, 185, 129, 0.4);
  color: var(--emerald);
  font-size: 0.72rem;
  font-weight: 700;
  padding: 6px 10px;
  border-radius: 999px;
  cursor: pointer;
}

main.content {
  flex: 1;
  padding: 8px 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
}

.card-highlight {
  background: linear-gradient(145deg, #26334d, #1e293b);
  border: 1px solid rgba(239, 68, 68, 0.35);
}

.row-between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.stat-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
}

.stat-box .label {
  font-size: 0.72rem;
  color: var(--muted);
  text-transform: uppercase;
  font-weight: 600;
}

.stat-box .value {
  font-size: 1.05rem;
  font-weight: 800;
  margin-top: 3px;
}

.btn {
  border: none;
  border-radius: 12px;
  padding: 13px 16px;
  font-size: 0.96rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.08s ease, opacity 0.15s ease;
}

.btn:active {
  transform: scale(0.98);
}

.btn-primary {
  background: var(--primary);
  color: #fff;
  width: 100%;
}

.btn-outline {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}

.btn-sm {
  padding: 7px 12px;
  font-size: 0.8rem;
  border-radius: 9px;
}

.btn-danger {
  background: rgba(239, 68, 68, 0.14);
  color: var(--primary);
  border: 1px solid rgba(239, 68, 68, 0.35);
}

.weight-badge {
  background: var(--primary-dark);
  color: #fff;
  padding: 8px 12px;
  border-radius: 10px;
  font-weight: 800;
  font-size: 0.92rem;
  white-space: nowrap;
}

.strike-badge {
  display: inline-block;
  margin-top: 6px;
  font-size: 0.74rem;
  color: var(--amber);
  font-weight: 600;
}

/* 5x5 Set Bubbles */
.bubbles-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 14px;
  gap: 6px;
}

.bubble-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

.set-bubble {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 2.5px solid var(--muted);
  background: transparent;
  color: var(--muted);
  font-size: 1.25rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.12s ease;
}

.set-bubble.success {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
  box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
}

.set-bubble.failed {
  background: var(--amber);
  border-color: var(--amber);
  color: #fff;
}

.bubble-caption {
  font-size: 0.7rem;
  color: var(--muted);
}

.chips-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.chip {
  background: var(--card);
  color: var(--muted);
  border: 1px solid var(--border);
  padding: 7px 13px;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
}

.chip.active {
  background: rgba(239, 68, 68, 0.18);
  color: #fff;
  border-color: var(--primary);
}

/* Rest Timer Dock */
.rest-timer-dock {
  position: fixed;
  bottom: 70px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 24px);
  max-width: 456px;
  background: #111827;
  border: 1.5px solid var(--primary);
  border-radius: 16px;
  padding: 12px 14px;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65);
  z-index: 50;
}

.timer-countdown {
  font-size: 1.65rem;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}

.progress-track {
  width: 100%;
  height: 6px;
  background: var(--border);
  border-radius: 999px;
  overflow: hidden;
  margin: 8px 0;
}

.progress-fill {
  height: 100%;
  background: var(--primary);
  transition: width 0.3s linear;
}

/* Barbell Sleeve Visualizer */
.barbell-Stage {
  background: #0b1120;
  border: 1px solid var(--border);
  border-radius: 12px;
  height: 140px;
  position: relative;
  display: flex;
  align-items: center;
  padding: 0 16px;
  margin: 14px 0;
  overflow-x: auto;
}

.bar-shaft {
  position: absolute;
  left: 0;
  right: 0;
  height: 14px;
  background: #64748b;
  z-index: 1;
}

.bar-collar {
  width: 16px;
  height: 40px;
  background: #475569;
  border-radius: 3px;
  z-index: 2;
  margin-right: 4px;
  flex-shrink: 0;
}

.plate-visual {
  width: 28px;
  border-radius: 4px;
  margin-right: 4px;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.68rem;
  font-weight: 800;
  border: 1px solid rgba(0,0,0,0.4);
  flex-shrink: 0;
}

/* Calendar Grid */
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  text-align: center;
  margin-top: 8px;
}

.cal-header {
  font-size: 0.72rem;
  color: var(--muted);
  font-weight: 700;
  padding-bottom: 4px;
}

.cal-day {
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 0.82rem;
}

.cal-day.workout-a {
  background: var(--primary);
  color: #fff;
  font-weight: 800;
}

.cal-day.workout-b {
  background: var(--blue);
  color: #fff;
  font-weight: 800;
}

/* Inputs */
.input-field {
  width: 100%;
  background: #0f172a;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 11px 12px;
  border-radius: 10px;
  font-size: 0.92rem;
}

/* Modal */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 100;
}

.modal-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  width: 100%;
  max-width: 430px;
  padding: 20px;
}

/* Bottom Navigation */
nav.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  height: 64px;
  background: #111827;
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  z-index: 60;
}

.nav-item {
  background: none;
  border: none;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  font-weight: 600;
  gap: 3px;
  cursor: pointer;
}

.nav-item.active {
  color: var(--primary);
}

.nav-icon {
  font-size: 1.15rem;
}

.toast-banner {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--emerald);
  color: #052e16;
  font-weight: 800;
  font-size: 0.85rem;
  padding: 10px 16px;
  border-radius: 999px;
  z-index: 120;
  box-shadow: 0 6px 20px rgba(0,0,0,0.45);
}

</style>
</head>
<body>
  <div id="toast-container"></div>

  <div class="app-shell">
    <header class="top-bar">
      <div>
        <h1>Five By Five Lifting</h1>
        <p>Offline-First Linear Progression Tracker</p>
      </div>
      <button id="sync-status-btn" class="sync-pill" title="Cloud Sync & Backup Settings">
        ☁️ Cloud Backup
      </button>
    </header>

    <main id="app-content" class="content"></main>

    <div id="rest-timer-container"></div>
    <div id="modal-container"></div>

    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="home">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </button>
      <button class="nav-item" data-tab="workout">
        <span class="nav-icon">🏋️</span>
        <span>Workout</span>
      </button>
      <button class="nav-item" data-tab="history">
        <span class="nav-icon">📅</span>
        <span>History</span>
      </button>
      <button class="nav-item" data-tab="graphs">
        <span class="nav-icon">📈</span>
        <span>Graphs</span>
      </button>
      <button class="nav-item" data-tab="settings">
        <span class="nav-icon">⚙️</span>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <!-- Hidden file input for restoring/merging Google Drive JSON backups -->
  <input type="file" id="restore-file-input" accept=".json,application/json" style="display:none" />

  <script>
// Five By Five Lifting v1.1.0 Offline-First PWA Engine
// Includes Pull-Down Workout Selector (A / B / C / D / E), Active Workout Switching, and Custom Workout Builder

const STORAGE_KEY = 'fivebyfivelifting_5x5_pwa_state_v1';
const LB_TO_KG = 0.45359237;

const EXERCISES = {
  SQUAT: { id: 'SQUAT', displayName: 'Squat', shortName: 'SQ', defaultStartLb: 45, defaultIncLb: 5, sets: 5, reps: 5 },
  BENCH_PRESS: { id: 'BENCH_PRESS', displayName: 'Bench Press', shortName: 'BP', defaultStartLb: 45, defaultIncLb: 5, sets: 5, reps: 5 },
  BARBELL_ROW: { id: 'BARBELL_ROW', displayName: 'Barbell Row', shortName: 'ROW', defaultStartLb: 65, defaultIncLb: 5, sets: 5, reps: 5 },
  OVERHEAD_PRESS: { id: 'OVERHEAD_PRESS', displayName: 'Overhead Press', shortName: 'OHP', defaultStartLb: 45, defaultIncLb: 5, sets: 5, reps: 5 },
  DEADLIFT: { id: 'DEADLIFT', displayName: 'Deadlift', shortName: 'DL', defaultStartLb: 95, defaultIncLb: 10, sets: 1, reps: 5 },
  FRONT_SQUAT: { id: 'FRONT_SQUAT', displayName: 'Front Squat', shortName: 'FSQ', defaultStartLb: 45, defaultIncLb: 5, sets: 5, reps: 5 },
  INCLINE_BENCH_PRESS: { id: 'INCLINE_BENCH_PRESS', displayName: 'Incline Bench Press', shortName: 'IBP', defaultStartLb: 45, defaultIncLb: 5, sets: 5, reps: 5 },
  ROMANIAN_DEADLIFT: { id: 'ROMANIAN_DEADLIFT', displayName: 'Romanian Deadlift', shortName: 'RDL', defaultStartLb: 95, defaultIncLb: 5, sets: 3, reps: 8 },
  CLOSE_GRIP_BENCH: { id: 'CLOSE_GRIP_BENCH', displayName: 'Close-Grip Bench', shortName: 'CGBP', defaultStartLb: 45, defaultIncLb: 5, sets: 3, reps: 8 },
  PULL_UPS: { id: 'PULL_UPS', displayName: 'Pull-ups / Chin-ups', shortName: 'PULL', defaultStartLb: 45, defaultIncLb: 2.5, sets: 3, reps: 8 },
  DIPS: { id: 'DIPS', displayName: 'Parallel Bar Dips', shortName: 'DIP', defaultStartLb: 45, defaultIncLb: 2.5, sets: 3, reps: 8 },
  BARBELL_CURL: { id: 'BARBELL_CURL', displayName: 'Barbell Curl', shortName: 'CURL', defaultStartLb: 45, defaultIncLb: 2.5, sets: 3, reps: 10 },
  SKULLCRUSHERS: { id: 'SKULLCRUSHERS', displayName: 'Skullcrushers', shortName: 'SKULL', defaultStartLb: 45, defaultIncLb: 2.5, sets: 3, reps: 10 },
  LATERAL_RAISE: { id: 'LATERAL_RAISE', displayName: 'Lateral Raise', shortName: 'LAT', defaultStartLb: 15, defaultIncLb: 2.5, sets: 3, reps: 12 },
  CUSTOM_1: { id: 'CUSTOM_1', displayName: 'Custom Lift 1', shortName: 'C1', defaultStartLb: 45, defaultIncLb: 5, sets: 5, reps: 5 },
  CUSTOM_2: { id: 'CUSTOM_2', displayName: 'Custom Lift 2', shortName: 'C2', defaultStartLb: 45, defaultIncLb: 5, sets: 5, reps: 5 },
  CUSTOM_3: { id: 'CUSTOM_3', displayName: 'Custom Lift 3', shortName: 'C3', defaultStartLb: 45, defaultIncLb: 5, sets: 3, reps: 8 }
};

const DEFAULT_TEMPLATES = {
  WORKOUT_A: { workoutType: 'WORKOUT_A', code: 'A', customTitle: 'Workout A', exercises: ['SQUAT', 'BENCH_PRESS', 'BARBELL_ROW'], isEnabled: true },
  WORKOUT_B: { workoutType: 'WORKOUT_B', code: 'B', customTitle: 'Workout B', exercises: ['SQUAT', 'OVERHEAD_PRESS', 'DEADLIFT'], isEnabled: true },
  WORKOUT_C: { workoutType: 'WORKOUT_C', code: 'C', customTitle: 'Workout C', exercises: ['FRONT_SQUAT', 'INCLINE_BENCH_PRESS', 'PULL_UPS', 'BARBELL_CURL'], isEnabled: true },
  WORKOUT_D: { workoutType: 'WORKOUT_D', code: 'D', customTitle: 'Workout D', exercises: ['ROMANIAN_DEADLIFT', 'CLOSE_GRIP_BENCH', 'DIPS'], isEnabled: false },
  WORKOUT_E: { workoutType: 'WORKOUT_E', code: 'E', customTitle: 'Workout E', exercises: ['SQUAT', 'BENCH_PRESS', 'DEADLIFT'], isEnabled: false }
};

const IMPERIAL_PLATES = [
  { weight: 45, label: '45', color: '#2563EB', height: 108, textColor: '#fff' },
  { weight: 35, label: '35', color: '#EAB308', height: 95, textColor: '#000' },
  { weight: 25, label: '25', color: '#16A34A', height: 82, textColor: '#fff' },
  { weight: 10, label: '10', color: '#E5E7EB', height: 68, textColor: '#000' },
  { weight: 5, label: '5', color: '#EF4444', height: 55, textColor: '#fff' },
  { weight: 2.5, label: '2.5', color: '#9CA3AF', height: 46, textColor: '#000' }
];

const METRIC_PLATES = [
  { weight: 20, label: '20', color: '#2563EB', height: 108, textColor: '#fff' },
  { weight: 15, label: '15', color: '#EAB308', height: 92, textColor: '#000' },
  { weight: 10, label: '10', color: '#16A34A', height: 78, textColor: '#fff' },
  { weight: 5, label: '5', color: '#E5E7EB', height: 62, textColor: '#000' },
  { weight: 2.5, label: '2.5', color: '#374151', height: 52, textColor: '#fff' },
  { weight: 1.25, label: '1.25', color: '#9CA3AF', height: 44, textColor: '#000' }
];

function createDefaultExerciseStates() {
  return Object.values(EXERCISES).map((ex) => ({
    exercise: ex.id,
    currentWeightLb: ex.defaultStartLb,
    incrementLb: ex.defaultIncLb,
    targetSets: ex.sets,
    targetReps: ex.reps,
    consecutiveFailures: 0,
    deloadCount: 0,
    customName: ''
  }));
}

function loadAppState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.exerciseStates)) {
        if (!parsed.workoutTemplates) {
          parsed.workoutTemplates = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));
        }
        return parsed;
      }
    }
  } catch (e) {
    console.error('Failed to read local storage:', e);
  }
  return {
    schemaVersion: 2,
    weightUnit: 'LB',
    barbellWeightLb: 45.0,
    nextWorkoutOverride: null,
    lastCloudSyncEpochMillis: null,
    workoutTemplates: JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)),
    exerciseStates: createDefaultExerciseStates(),
    activeSession: null,
    sessions: [],
    bodyweightEntries: []
  };
}

let state = loadAppState();
let currentTab = 'home';
let warmupToggleByExercise = {};
let calendarMonthOffset = 0;
let selectedGraphTarget = 'SQUAT';
let selectedGraphRangeDays = null;

// Rest timer live state
let restTimer = {
  isRunning: false,
  remainingSeconds: 0,
  totalSeconds: 0,
  exerciseName: '',
  completedReps: 5,
  reasonLabel: '',
  intervalId: null
};

function saveAppState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function roundToStep(val, step) {
  return Math.round(val / step) * step;
}

function fromLb(weightLb, unit = state.weightUnit) {
  if (unit === 'KG') return roundToStep(weightLb * LB_TO_KG, 1.25);
  return roundToStep(weightLb, 2.5);
}

function toLb(displayWeight, unit = state.weightUnit) {
  return unit === 'KG' ? displayWeight / LB_TO_KG : displayWeight;
}

function formatWeight(weightLb, includeUnit = true, unit = state.weightUnit) {
  const converted = fromLb(weightLb, unit);
  const str = Number.isInteger(converted) ? converted.toString() : converted.toFixed(2).replace(/\.?0+$/, '');
  return includeUnit ? `${str} ${unit.toLowerCase()}` : str;
}

function getExerciseState(exerciseId) {
  let found = state.exerciseStates.find((s) => s.exercise === exerciseId);
  if (!found) {
    const def = EXERCISES[exerciseId] || EXERCISES.SQUAT;
    found = {
      exercise: def.id,
      currentWeightLb: def.defaultStartLb,
      incrementLb: def.defaultIncLb,
      targetSets: def.sets,
      targetReps: def.reps,
      consecutiveFailures: 0,
      deloadCount: 0,
      customName: ''
    };
    state.exerciseStates.push(found);
  }
  return found;
}

function getExerciseName(exerciseId) {
  const st = getExerciseState(exerciseId);
  if (st.customName && st.customName.trim()) return st.customName.trim();
  return EXERCISES[exerciseId]?.displayName || exerciseId;
}

function getTemplate(workoutType) {
  if (!state.workoutTemplates) state.workoutTemplates = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));
  if (!state.workoutTemplates[workoutType]) {
    state.workoutTemplates[workoutType] = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES[workoutType] || DEFAULT_TEMPLATES.WORKOUT_A));
  }
  return state.workoutTemplates[workoutType];
}

function getEnabledTemplates() {
  return Object.keys(DEFAULT_TEMPLATES)
    .map((k) => getTemplate(k))
    .filter((t) => t.isEnabled);
}

function getTemplateSubtitle(workoutType) {
  const t = getTemplate(workoutType);
  return t.exercises.map((exId) => getExerciseName(exId)).join(' • ');
}

function getNextWorkoutType() {
  const enabled = getEnabledTemplates().map((t) => t.workoutType);
  if (state.nextWorkoutOverride && enabled.includes(state.nextWorkoutOverride)) {
    return state.nextWorkoutOverride;
  }
  if (state.sessions.length === 0) return enabled[0] || 'WORKOUT_A';
  const sorted = [...state.sessions].sort((a, b) => (b.session.completedAtEpochMillis || 0) - (a.session.completedAtEpochMillis || 0));
  const lastType = sorted[0].session.workoutType;
  const idx = enabled.indexOf(lastType);
  return idx >= 0 ? enabled[(idx + 1) % enabled.length] : (enabled[0] || 'WORKOUT_A');
}

function calculatePlates(targetWeightLb, barWeightLb = state.barbellWeightLb, unit = state.weightUnit) {
  const targetDisplay = fromLb(targetWeightLb, unit);
  const barDisplay = unit === 'KG' && Math.abs(barWeightLb - 45) < 1.5 ? 20 : fromLb(barWeightLb, unit);
  if (targetDisplay <= barDisplay) {
    return {
      targetDisplay,
      barDisplay,
      platesPerSide: [],
      summary: `Empty bar (${barDisplay} ${unit.toLowerCase()})`
    };
  }
  let rem = (targetDisplay - barDisplay) / 2.0;
  const catalog = unit === 'LB' ? IMPERIAL_PLATES : METRIC_PLATES;
  const chosen = [];
  for (const plate of catalog) {
    while (rem + 1e-6 >= plate.weight) {
      chosen.push(plate);
      rem -= plate.weight;
    }
  }
  const summary = chosen.length === 0
    ? `Empty bar (${barDisplay} ${unit.toLowerCase()})`
    : `${chosen.map((p) => p.label).join(' + ')} ${unit.toLowerCase()} / side`;
  return { targetDisplay, barDisplay, platesPerSide: chosen, summary };
}

function generateWarmupSets(exerciseId, workingWeightLb, barWeightLb = state.barbellWeightLb) {
  const startWeight = exerciseId === 'DEADLIFT' ? (workingWeightLb >= 155 ? 135 : 65) : barWeightLb;
  if (workingWeightLb <= startWeight + 5) return [];

  const warmups = [];
  let setNum = 1;
  if (exerciseId === 'DEADLIFT') {
    warmups.push({ setNumber: setNum++, weightLb: startWeight, targetReps: 5 });
  } else {
    warmups.push({ setNumber: setNum++, weightLb: startWeight, targetReps: 5 });
    warmups.push({ setNumber: setNum++, weightLb: startWeight, targetReps: 5 });
  }

  const diff = workingWeightLb - startWeight;
  let steps = [];
  if (diff <= 40) {
    steps = [[0.55, 3]];
  } else if (diff <= 90) {
    steps = [[0.45, 5], [0.75, 3]];
  } else {
    steps = [[0.40, 5], [0.65, 3], [0.85, 2]];
  }

  let lastW = startWeight;
  for (const [fraction, reps] of steps) {
    const rounded = roundToStep(startWeight + diff * fraction, 5);
    if (rounded > lastW && rounded < workingWeightLb) {
      warmups.push({ setNumber: setNum++, weightLb: rounded, targetReps: reps });
      lastW = rounded;
    }
  }
  return warmups;
}

function nextRepState(currentReps, targetReps = 5) {
  if (currentReps === null || currentReps === undefined) return targetReps;
  if (currentReps > 0) return currentReps - 1;
  return null;
}

function calculateTenPercentDeloadLb(currentWeightLb, minBarWeightLb = 45) {
  if (currentWeightLb <= minBarWeightLb) return minBarWeightLb;
  const raw = currentWeightLb * 0.90;
  const roundedDown = Math.floor((raw + 1e-6) / 5) * 5;
  const effective = roundedDown >= currentWeightLb ? currentWeightLb - 5 : roundedDown;
  return Math.max(minBarWeightLb, effective);
}

function evaluateExerciseSession(exState, workingSets, minBarWeightLb = 45) {
  const completedCount = workingSets.filter((s) => (s.completedReps ?? -1) >= exState.targetReps).length;
  const allSucceeded = workingSets.length > 0 && completedCount >= exState.targetSets;

  if (allSucceeded) {
    const effectiveInc = (exState.exercise === 'DEADLIFT' && exState.currentWeightLb >= 225 && exState.incrementLb >= 10)
      ? 5
      : exState.incrementLb;
    const nextWeightLb = exState.currentWeightLb + effectiveInc;
    return {
      exercise: exState.exercise,
      previousWeightLb: exState.currentWeightLb,
      nextWeightLb,
      nextConsecutiveFailures: 0,
      nextDeloadCount: exState.deloadCount,
      action: 'INCREMENTED'
    };
  } else {
    const nextFailures = (exState.consecutiveFailures || 0) + 1;
    if (nextFailures >= 3) {
      const deloadWeight = calculateTenPercentDeloadLb(exState.currentWeightLb, minBarWeightLb);
      return {
        exercise: exState.exercise,
        previousWeightLb: exState.currentWeightLb,
        nextWeightLb: deloadWeight,
        nextConsecutiveFailures: 0,
        nextDeloadCount: (exState.deloadCount || 0) + 1,
        action: 'DELOADED_10_PERCENT'
      };
    } else {
      return {
        exercise: exState.exercise,
        previousWeightLb: exState.currentWeightLb,
        nextWeightLb: exState.currentWeightLb,
        nextConsecutiveFailures: nextFailures,
        nextDeloadCount: exState.deloadCount,
        action: 'REPEATED_AFTER_FAILURE'
      };
    }
  }
}

function playBeepAndVibrate() {
  try {
    if (navigator.vibrate) navigator.vibrate([250, 120, 250]);
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.35);
  } catch (_) {}
}

function startRestTimer(seconds, exerciseName, completedReps, reasonLabel) {
  if (restTimer.intervalId) clearInterval(restTimer.intervalId);
  restTimer = {
    isRunning: true,
    remainingSeconds: seconds,
    totalSeconds: seconds,
    exerciseName,
    completedReps,
    reasonLabel,
    intervalId: setInterval(() => {
      if (restTimer.remainingSeconds > 0) {
        restTimer.remainingSeconds -= 1;
        renderRestTimerDock();
      } else {
        clearInterval(restTimer.intervalId);
        restTimer.isRunning = false;
        restTimer.intervalId = null;
        playBeepAndVibrate();
        renderRestTimerDock();
      }
    }, 1000)
  };
  renderRestTimerDock();
}

function stopRestTimer() {
  if (restTimer.intervalId) clearInterval(restTimer.intervalId);
  restTimer = {
    isRunning: false,
    remainingSeconds: 0,
    totalSeconds: 0,
    exerciseName: '',
    completedReps: 5,
    reasonLabel: '',
    intervalId: null
  };
  renderRestTimerDock();
}

function renderRestTimerDock() {
  const container = document.getElementById('rest-timer-container');
  if (!restTimer.isRunning && restTimer.totalSeconds === 0) {
    container.innerHTML = '';
    return;
  }
  const mins = String(Math.floor(restTimer.remainingSeconds / 60)).padStart(2, '0');
  const secs = String(restTimer.remainingSeconds % 60).padStart(2, '0');
  const pct = restTimer.totalSeconds > 0
    ? Math.round((restTimer.remainingSeconds / restTimer.totalSeconds) * 100)
    : 0;

  container.innerHTML = `
    <div class="rest-timer-dock">
      <div class="row-between">
        <div>
          <div style="font-size:0.78rem;font-weight:800;color:var(--primary)">
            ${restTimer.remainingSeconds > 0 ? `REST TIMER • ${restTimer.exerciseName.toUpperCase()}` : 'REST COMPLETE — GO LIFT!'}
          </div>
          <div style="font-size:0.74rem;color:var(--muted);margin-top:2px">${restTimer.reasonLabel}</div>
        </div>
        <div class="timer-countdown">${mins}:${secs}</div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>
      <div class="row-between">
        <div style="display:flex;gap:8px">
          <button class="btn btn-outline btn-sm" onclick="adjustRestTimer(30)">+30s</button>
          ${restTimer.completedReps >= 5 && restTimer.totalSeconds < 180 ? `
            <button class="btn btn-outline btn-sm" onclick="switchRestToThreeMin()">Felt Heavy (3:00)</button>
          ` : ''}
        </div>
        <button class="btn btn-danger btn-sm" onclick="stopRestTimer()">Dismiss</button>
      </div>
    </div>
  `;
}

window.adjustRestTimer = function(delta) {
  restTimer.remainingSeconds = Math.max(5, restTimer.remainingSeconds + delta);
  restTimer.totalSeconds = Math.max(restTimer.totalSeconds, restTimer.remainingSeconds);
  renderRestTimerDock();
};

window.switchRestToThreeMin = function() {
  restTimer.remainingSeconds = 180;
  restTimer.totalSeconds = 180;
  restTimer.reasonLabel = 'Heavy set — Resting 3:00 before next set';
  renderRestTimerDock();
};

window.stopRestTimer = stopRestTimer;

function showToast(msg) {
  const c = document.getElementById('toast-container');
  c.innerHTML = `<div class="toast-banner">${msg}</div>`;
  setTimeout(() => { c.innerHTML = ''; }, 2800);
}

function buildSetsForWorkoutType(workoutType, sessionId) {
  const template = getTemplate(workoutType);
  let setIdCounter = 1;
  const sets = [];
  for (const exId of template.exercises) {
    const exState = getExerciseState(exId);
    const warmups = generateWarmupSets(exId, exState.currentWeightLb, state.barbellWeightLb);
    for (const wu of warmups) {
      sets.push({
        id: setIdCounter++,
        sessionId,
        exercise: exId,
        setNumber: wu.setNumber,
        isWarmup: true,
        targetWeightLb: wu.weightLb,
        targetReps: wu.targetReps,
        completedReps: null
      });
    }
    for (let i = 1; i <= exState.targetSets; i++) {
      sets.push({
        id: setIdCounter++,
        sessionId,
        exercise: exId,
        setNumber: i,
        isWarmup: false,
        targetWeightLb: exState.currentWeightLb,
        targetReps: exState.targetReps,
        completedReps: null
      });
    }
  }
  return sets;
}

function startOrResumeWorkout() {
  if (!state.activeSession) {
    const workoutType = getNextWorkoutType();
    const now = Date.now();
    state.activeSession = {
      session: {
        id: now,
        workoutType,
        startedAtEpochMillis: now,
        completedAtEpochMillis: null,
        bodyweightLb: null,
        notes: '',
        isCompleted: false
      },
      sets: buildSetsForWorkoutType(workoutType, now)
    };
    saveAppState();
  }
  switchTab('workout');
}

// Pull-Down Workout Switcher Handler
window.onPullDownWorkoutChange = function(value) {
  if (value === '__CREATE__') {
    const currentType = state.activeSession ? state.activeSession.session.workoutType : getNextWorkoutType();
    openWorkoutBuilderModal(currentType);
    render();
    return;
  }
  state.nextWorkoutOverride = value;
  if (state.activeSession) {
    stopRestTimer();
    state.activeSession.session.workoutType = value;
    state.activeSession.sets = buildSetsForWorkoutType(value, state.activeSession.session.id);
    showToast(`Switched active workout to ${getTemplate(value).customTitle}`);
  }
  saveAppState();
  render();
};

          </div>

          <div class="row-between" style="margin-bottom:12px">
            <button class="btn btn-outline" style="flex:1" id="plate-minus-btn">-${step} ${state.weightUnit.toLowerCase()}</button>
            <button class="btn btn-outline" style="flex:1" id="plate-plus-btn">+${step} ${state.weightUnit.toLowerCase()}</button>

function updateExerciseWorkingWeight(exerciseId, newWeightLb) {
  const exState = getExerciseState(exerciseId);
  exState.currentWeightLb = Math.max(5, newWeightLb);
  exState.consecutiveFailures = 0;

  if (state.activeSession) {
    state.activeSession.sets.forEach((s) => {
      if (!s.isWarmup && s.exercise === exerciseId) {
        s.targetWeightLb = exState.currentWeightLb;
      }
    });
  }
  saveAppState();
  render();
  showToast(`Updated ${getExerciseName(exerciseId)} to ${formatWeight(newWeightLb)}`);
}

window.setWarmupTab = function(exId, showWarmup) {
  warmupToggleByExercise[exId] = showWarmup;
  render();

window.tapSetBubble = function(setId) {
  if (!state.activeSession) return;
  const set = state.activeSession.sets.find((s) => s.id === setId);
  if (!set) return;

  set.completedReps = nextRepState(set.completedReps, set.targetReps);
  saveAppState();
  render();

  if (!set.isWarmup) {
    if (set.completedReps === null) {
      stopRestTimer();
    } else if (set.completedReps >= set.targetReps) {
      startRestTimer(
        90,
        getExerciseName(set.exercise),
        set.completedReps,
        `Completed ${set.targetReps} reps — Rest 1:30 (or 3:00 if heavy)`
      );
    } else {
      startRestTimer(
        300,
        getExerciseName(set.exercise),
        set.completedReps,
        `Missed rep (${set.completedReps}/${set.targetReps}) — Rest 5:00 to recover`
      );
    }
  }
};

function finishActiveWorkout() {
  if (!state.activeSession) return;
  const bwInput = document.getElementById('workout-bw-input')?.value?.trim();
  const notesInput = document.getElementById('workout-notes-input')?.value?.trim() || '';
  const parsedBw = bwInput ? parseFloat(bwInput) : null;
  const bwLb = parsedBw && parsedBw > 0 ? toLb(parsedBw) : null;

  stopRestTimer();
  const active = state.activeSession;
  const wDef = getTemplate(active.session.workoutType);
  const exercisesInSession = Array.from(new Set(active.sets.filter((s) => !s.isWarmup).map((s) => s.exercise)));
  const results = [];

  for (const exId of exercisesInSession) {
    const exState = getExerciseState(exId);
    const workSets = active.sets.filter((s) => !s.isWarmup && s.exercise === exId);
    const outcome = evaluateExerciseSession(exState, workSets, state.barbellWeightLb);
    exState.currentWeightLb = outcome.nextWeightLb;
    exState.consecutiveFailures = outcome.nextConsecutiveFailures;
    exState.deloadCount = outcome.nextDeloadCount;
    results.push(outcome);
  }

  const now = Date.now();
  active.session.completedAtEpochMillis = now;
  active.session.bodyweightLb = bwLb;
  active.session.notes = notesInput;
  active.session.isCompleted = true;

  state.sessions.push(active);
  if (bwLb) {
    state.bodyweightEntries.push({
      id: now,
      recordedAtEpochMillis: now,
      weightLb: bwLb,
      sessionId: active.session.id
    });
  }
  state.activeSession = null;
  state.nextWorkoutOverride = null;
  saveAppState();

  const totalVolumeLb = active.sets
    .filter((s) => !s.isWarmup && (s.completedReps || 0) > 0)
    .reduce((sum, s) => sum + s.targetWeightLb * s.completedReps, 0);

  const linesHtml = results.map((r) => {
    const name = getExerciseName(r.exercise);
    if (r.action === 'INCREMENTED') {
      return `<li><strong>${name}:</strong> ${formatWeight(r.previousWeightLb)} → <span style="color:var(--emerald);font-weight:800">${formatWeight(r.nextWeightLb)} (+Progress!)</span></li>`;
    } else if (r.action === 'DELOADED_10_PERCENT') {
      return `<li><strong>${name}:</strong> 10% Deload → <span style="color:var(--amber);font-weight:800">${formatWeight(r.nextWeightLb)}</span> (3 strikes reached)</li>`;
    } else {
      return `<li><strong>${name}:</strong> Repeat ${formatWeight(r.nextWeightLb)} next session (Strike ${r.nextConsecutiveFailures}/3)</li>`;
    }
  }).join('');

  switchTab('home');

  document.getElementById('modal-container').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal-card">
        <h3 style="margin:0 0 6px;font-size:1.25rem">🎉 ${wDef.customTitle} Complete!</h3>
        <div style="font-size:0.9rem;color:var(--primary);font-weight:800;margin-bottom:12px">
          Total Volume Lifted: ${formatWeight(totalVolumeLb)}
        </div>
        <ul style="padding-left:18px;margin:0 0 16px;display:flex;flex-direction:column;gap:8px;font-size:0.9rem">
          ${linesHtml}
        </ul>
        <div style="display:flex;gap:8px">
          <button class="btn btn-outline" style="flex:1" onclick="exportJsonBackup()">☁️ Backup to Drive</button>
          <button class="btn btn-primary" style="flex:1" onclick="closeModal()">Awesome!</button>
        </div>
      </div>
    </div>
  `;
}

// Render History & Monthly Calendar
function renderHistory() {
  const refDate = new Date();
  refDate.setDate(1);
  refDate.setMonth(refDate.getMonth() + calendarMonthOffset);
  const year = refDate.getFullYear();
  const month = refDate.getMonth();
  const monthTitle = refDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startDow = new Date(year, month, 1).getDay();

  const dayWorkouts = {};
  state.sessions.forEach((s) => {
    const d = new Date(s.session.completedAtEpochMillis || s.session.startedAtEpochMillis);
    if (d.getFullYear() === year && d.getMonth() === month) {
      dayWorkouts[d.getDate()] = s.session.workoutType;
    }
  });

  let cellsHtml = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d) => `<div class="cal-header">${d}</div>`).join('');
  for (let i = 0; i < startDow; i++) {
    cellsHtml += `<div class="cal-day"></div>`;
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const wt = dayWorkouts[day];
    const cls = wt === 'WORKOUT_A' ? 'workout-a' : (wt ? 'workout-b' : '');
    cellsHtml += `<div class="cal-day ${cls}">${day}</div>`;
  }

  const sortedSessions = [...state.sessions].sort((a, b) =>
    (b.session.completedAtEpochMillis || 0) - (a.session.completedAtEpochMillis || 0)
  );

  const sessionsHtml = sortedSessions.length === 0
    ? `<div class="card" style="color:var(--muted)">No completed workouts yet. Start your first workout on the Home tab or load sample workouts in Settings!</div>`
    : sortedSessions.map((s) => {
        const wDef = getTemplate(s.session.workoutType);
        const dateStr = new Date(s.session.completedAtEpochMillis || s.session.startedAtEpochMillis)
          .toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
        const volLb = s.sets
          .filter((x) => !x.isWarmup && (x.completedReps || 0) > 0)
          .reduce((sum, x) => sum + x.targetWeightLb * x.completedReps, 0);
        const bwStr = s.session.bodyweightLb ? ` • BW: ${formatWeight(s.session.bodyweightLb)}` : '';

        const distinctExercises = Array.from(new Set(s.sets.filter((x) => !x.isWarmup).map((x) => x.exercise)));
        const liftsRows = distinctExercises.map((exId) => {
          const wSets = s.sets.filter((x) => !x.isWarmup && x.exercise === exId);
          const wLb = wSets[0]?.targetWeightLb || 0;
          const repsJoined = wSets.map((x) => x.completedReps ?? 0).join('/');
          return `
            <div class="row-between" style="font-size:0.88rem;margin-top:4px">
              <span style="font-weight:700">${getExerciseName(exId)}</span>
              <span style="color:var(--muted)">${formatWeight(wLb)} (${repsJoined})</span>
            </div>
          `;
        }).join('');

        return `
          <div class="card">
            <div class="row-between" style="margin-bottom:6px">
              <div>
                <div style="font-weight:800;color:${s.session.workoutType === 'WORKOUT_A' ? 'var(--primary)' : 'var(--blue)'}">
                  ${wDef.customTitle} • ${dateStr}
                </div>
                <div style="font-size:0.75rem;color:var(--muted)">
                  Volume: ${formatWeight(volLb)}${bwStr}
                </div>
              </div>
              <button class="btn btn-danger btn-sm" onclick="deleteSession(${s.session.id})">Delete</button>
            </div>
            ${liftsRows}
            ${s.session.notes ? `<div style="font-size:0.78rem;color:var(--muted);margin-top:6px">Note: ${s.session.notes}</div>` : ''}
          </div>
        `;
      }).join('');

  return `
    <div class="card">
      <div class="row-between">
        <button class="btn btn-outline btn-sm" onclick="changeCalMonth(-1)">◀ Prev</button>
        <div style="font-weight:800">${monthTitle}</div>
        <button class="btn btn-outline btn-sm" onclick="changeCalMonth(1)">Next ▶</button>
      </div>
      <div class="calendar-grid">${cellsHtml}</div>
    </div>

    <div style="font-size:0.95rem;font-weight:800;margin-top:4px">
      Completed Workouts (${state.sessions.length})
    </div>
    ${sessionsHtml}
  `;
}

// Render Progress Charts & Analytics
function renderGraphs() {
  const targets = [
    { key: 'SQUAT', label: 'Squat' },
    { key: 'BENCH_PRESS', label: 'Bench' },
    { key: 'BARBELL_ROW', label: 'Row' },
    { key: 'OVERHEAD_PRESS', label: 'OHP' },
    { key: 'DEADLIFT', label: 'Deadlift' },
    { key: 'BODYWEIGHT', label: 'Bodyweight' }
  ];
  const ranges = [
    { label: '1M', days: 30 },
    { label: '3M', days: 90 },
    { label: '6M', days: 180 },
    { label: '1Y', days: 365 },
    { label: 'ALL', days: null }
  ];

  const cutoff = selectedGraphRangeDays ? Date.now() - selectedGraphRangeDays * 86400000 : 0;
  let points = [];

  if (selectedGraphTarget === 'BODYWEIGHT') {
    points = state.bodyweightEntries
      .filter((e) => e.recordedAtEpochMillis >= cutoff)
      .sort((a, b) => a.recordedAtEpochMillis - b.recordedAtEpochMillis)
      .map((e) => ({ ts: e.recordedAtEpochMillis, weightLb: e.weightLb }));
  } else {
    points = state.sessions
      .filter((s) => (s.session.completedAtEpochMillis || s.session.startedAtEpochMillis) >= cutoff)
      .sort((a, b) => a.session.startedAtEpochMillis - b.session.startedAtEpochMillis)
      .map((s) => {
        const wSets = s.sets.filter((x) => !x.isWarmup && x.exercise === selectedGraphTarget);
        if (wSets.length === 0) return null;
        return {
          ts: s.session.completedAtEpochMillis || s.session.startedAtEpochMillis,
          weightLb: wSets[0].targetWeightLb
        };
      })
      .filter(Boolean);

    if (points.length === 0) {
      points = [{ ts: Date.now(), weightLb: getExerciseState(selectedGraphTarget).currentWeightLb }];
    }
  }

  const currentLb = points[points.length - 1]?.weightLb || 0;
  const maxLb = points.reduce((m, p) => Math.max(m, p.weightLb), 0);
  const est1RmLb = selectedGraphTarget !== 'BODYWEIGHT' && maxLb > 0
    ? maxLb * (1 + 5 / 30.0)
    : 0;

  const displayValues = points.map((p) => fromLb(p.weightLb));
  const minVal = (displayValues.length ? Math.min(...displayValues) : 0) - 5;
  const maxVal = (displayValues.length ? Math.max(...displayValues) : 100) + 5;
  const valRange = Math.max(10, maxVal - minVal);
  const svgW = 380;
  const svgH = 190;
  const pad = 24;

  const coords = displayValues.map((v, idx) => {
    const x = displayValues.length <= 1
      ? svgW / 2
      : pad + ((svgW - pad * 2) * idx) / (displayValues.length - 1);
    const normY = (v - minVal) / valRange;
    const y = pad + (svgH - pad * 2) * (1 - normY);
    return { x, y, v };
  });

  const polylinePoints = coords.map((c) => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
  const strokeColor = selectedGraphTarget === 'BODYWEIGHT' ? '#10B981' : '#EF4444';

  const svgHtml = displayValues.length === 0
    ? `<div style="padding:36px 0;text-align:center;color:var(--muted)">No entries recorded yet.</div>`
    : `
      <svg viewBox="0 0 ${svgW} ${svgH}" style="width:100%;height:200px;overflow:visible">
        <line x1="${pad}" y1="${pad}" x2="${svgW - pad}" y2="${pad}" stroke="rgba(255,255,255,0.08)" />
        <line x1="${pad}" y1="${svgH / 2}" x2="${svgW - pad}" y2="${svgH / 2}" stroke="rgba(255,255,255,0.08)" />
        <line x1="${pad}" y1="${svgH - pad}" x2="${svgW - pad}" y2="${svgH - pad}" stroke="rgba(255,255,255,0.08)" />
        ${coords.length >= 2 ? `<polyline fill="none" stroke="${strokeColor}" stroke-width="3.5" points="${polylinePoints}" />` : ''}
        ${coords.map((c) => `
          <circle cx="${c.x}" cy="${c.y}" r="5" fill="${strokeColor}" />
          <text x="${c.x}" y="${c.y - 10}" fill="#cbd5e1" font-size="10" font-weight="700" text-anchor="middle">${c.v}</text>
        `).join('')}
      </svg>
    `;

  return `
    <div class="chips-row">
      ${targets.map((t) => `
        <button class="chip ${selectedGraphTarget === t.key ? 'active' : ''}" onclick="selectGraphTarget('${t.key}')">
          ${t.label}
        </button>
      `).join('')}
    </div>

    <div class="chips-row">
      ${ranges.map((r) => `
        <button class="chip ${selectedGraphRangeDays === r.days ? 'active' : ''}" onclick="selectGraphRange(${r.days})">
          ${r.label}
        </button>
      `).join('')}
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="label">Current</div>
        <div class="value">${currentLb > 0 ? formatWeight(currentLb) : '—'}</div>
      </div>
      <div class="stat-box">
        <div class="label">Peak PR</div>
        <div class="value">${maxLb > 0 ? formatWeight(maxLb) : '—'}</div>
      </div>
      <div class="stat-box">
        <div class="label">Est. 1RM</div>
        <div class="value">${est1RmLb > 0 ? formatWeight(est1RmLb) : '—'}</div>
      </div>
    </div>

    <div class="card">
      <div style="font-weight:800;margin-bottom:6px">
        ${targets.find((t) => t.key === selectedGraphTarget)?.label} Progression (${state.weightUnit.toLowerCase()})
      </div>
      ${svgHtml}
    </div>
  `;
}

  render();

  render();
};

window.exportJsonBackup = async function() {
  const now = Date.now();
  state.lastCloudSyncEpochMillis = now;
  saveAppState();

  const snapshot = {
    schemaVersion: 1,
    exportedAtEpochMillis: now,
    weightUnit: state.weightUnit,
    barbellWeightLb: state.barbellWeightLb,
    exerciseStates: state.exerciseStates,
    sessions: state.sessions,
    bodyweightEntries: state.bodyweightEntries
  };

  const jsonStr = JSON.stringify(snapshot, null, 2);
  const blob = new Blob([jsonStr], { type: 'application/json' });
  const fileName = 'fivebyfivelifting_cloud_sync.json';

  if (navigator.canShare && navigator.share) {
    try {
      const file = new File([blob], fileName, { type: 'application/json' });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({
          title: 'Five By Five Lifting Cloud Backup',
          text: 'Five By Five Lifting workout database backup',
          files: [file]
        });
        render();
        showToast('Backed up to Cloud / Google Drive!');
        return;
      }
    } catch (_) {}
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  a.click();
  URL.revokeObjectURL(url);
  render();
  showToast('Downloaded fivebyfivelifting_cloud_sync.json');
};

window.triggerRestoreFilePicker = function() {
  const input = document.getElementById('restore-file-input');
  input.value = '';

};

document.getElementById('restore-file-input').addEventListener('change', (event) => {
  const file = event.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const cloud = JSON.parse(reader.result);
      if (!cloud || !Array.isArray(cloud.sessions)) {
        alert('Invalid backup JSON file.');
        return;
      }
      const mergedMap = new Map();
      for (const s of [...state.sessions, ...cloud.sessions]) {
        const key = `${s.session.startedAtEpochMillis}_${s.session.workoutType}`;
        mergedMap.set(key, s);
      }
      state.sessions = Array.from(mergedMap.values()).sort(
        (a, b) => a.session.startedAtEpochMillis - b.session.startedAtEpochMillis
      );

      if (Array.isArray(cloud.exerciseStates) && cloud.exerciseStates.length > 0) {
        state.exerciseStates = cloud.exerciseStates;
      }
      if (Array.isArray(cloud.bodyweightEntries)) {
        const bwMap = new Map();
        for (const b of [...state.bodyweightEntries, ...cloud.bodyweightEntries]) {
          bwMap.set(`${b.recordedAtEpochMillis}_${b.weightLb}`, b);
        }
        state.bodyweightEntries = Array.from(bwMap.values());
      }
      state.lastCloudSyncEpochMillis = Date.now();
      saveAppState();
      render();
      showToast(`Restored & merged ${state.sessions.length} workouts!`);
    } catch (e) {
      alert('Failed to parse backup file: ' + e.message);
    }
  };
  reader.readAsText(file);
});

window.exportCsvBackup = function() {
  const lines = ['Date,Workout,Exercise,SetNumber,SetType,TargetWeight,Unit,TargetReps,CompletedReps,Bodyweight'];
  for (const s of state.sessions) {
    const dt = new Date(s.session.completedAtEpochMillis || s.session.startedAtEpochMillis).toISOString().slice(0, 16).replace('T', ' ');
    const code = getTemplate(s.session.workoutType).code || 'A';
    const bw = s.session.bodyweightLb ? formatWeight(s.session.bodyweightLb, false) : '';
    for (const set of s.sets) {
      const typeStr = set.isWarmup ? 'Warmup' : 'Work';
      const wStr = formatWeight(set.targetWeightLb, false);
      lines.push(`"${dt}",${code},"${getExerciseName(set.exercise)}",${set.setNumber},${typeStr},${wStr},${state.weightUnit.toLowerCase()},${set.targetReps},${set.completedReps ?? ''},${bw}`);
    }
  }
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'fivebyfivelifting_workouts.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Exported fivebyfivelifting_workouts.csv');
};

window.seedDemoWorkouts = function() {
  const now = Date.now();
  const dayMs = 86400000;
  const demoSchedule = [
    { daysAgo: 12, type: 'WORKOUT_A', sq: 135, bp: 95, row: 95, bw: 178.0 },
    { daysAgo: 10, type: 'WORKOUT_B', sq: 140, ohp: 65, dl: 155, bw: 177.6 },
    { daysAgo: 8,  type: 'WORKOUT_A', sq: 145, bp: 100, row: 100, bw: 177.2 },
    { daysAgo: 5,  type: 'WORKOUT_B', sq: 150, ohp: 70, dl: 165, bw: 176.8 },
    { daysAgo: 3,  type: 'WORKOUT_A', sq: 155, bp: 105, row: 105, bw: 176.4 },
    { daysAgo: 1,  type: 'WORKOUT_B', sq: 160, ohp: 75, dl: 175, bw: 176.0 }
  ];

  state.sessions = [];
  state.bodyweightEntries = [];

  demoSchedule.forEach((item, idx) => {
    const ts = now - item.daysAgo * dayMs;
    const sets = [];
    let sid = 1;
    const addWorkSets = (exId, weight, count) => {
      for (let i = 1; i <= count; i++) {
        sets.push({
          id: sid++,
          sessionId: ts,
          exercise: exId,
          setNumber: i,
          isWarmup: false,
          targetWeightLb: weight,
          targetReps: 5,
          completedReps: 5
        });
      }
    };
    if (item.type === 'WORKOUT_A') {
      addWorkSets('SQUAT', item.sq, 5);
      addWorkSets('BENCH_PRESS', item.bp, 5);
      addWorkSets('BARBELL_ROW', item.row, 5);
    } else {
      addWorkSets('SQUAT', item.sq, 5);
      addWorkSets('OVERHEAD_PRESS', item.ohp, 5);
      addWorkSets('DEADLIFT', item.dl, 1);
    }
    state.sessions.push({
      session: {
        id: ts + idx,
        workoutType: item.type,
        startedAtEpochMillis: ts - 2700000,
        completedAtEpochMillis: ts,
        bodyweightLb: item.bw,
        notes: 'Completed 5x5 progression session',
        isCompleted: true
      },
      sets
    });
    state.bodyweightEntries.push({
      id: ts + idx,
      recordedAtEpochMillis: ts,
      weightLb: item.bw,
      sessionId: ts + idx
    });
  });

  getExerciseState('SQUAT').currentWeightLb = 165;
  getExerciseState('BENCH_PRESS').currentWeightLb = 110;
  getExerciseState('BARBELL_ROW').currentWeightLb = 110;
  getExerciseState('OVERHEAD_PRESS').currentWeightLb = 80;
  getExerciseState('DEADLIFT').currentWeightLb = 185;

  saveAppState();
  render();
  showToast('Loaded 6 sample workouts!');
};

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  render();
}

function render() {
  const container = document.getElementById('app-content');
  if (currentTab === 'home') {
    container.innerHTML = renderHome();
    document.getElementById('start-workout-btn')?.addEventListener('click', startOrResumeWorkout);
  } else if (currentTab === 'workout') {
    container.innerHTML = renderWorkout();
    document.getElementById('start-workout-empty-btn')?.addEventListener('click', startOrResumeWorkout);
    document.getElementById('discard-workout-btn')?.addEventListener('click', () => {
      stopRestTimer();
      state.activeSession = null;
      saveAppState();
      switchTab('home');
      showToast('Workout discarded');
    });
    document.getElementById('finish-workout-btn')?.addEventListener('click', finishActiveWorkout);
  } else if (currentTab === 'history') {
    container.innerHTML = renderHistory();
  } else if (currentTab === 'graphs') {
    container.innerHTML = renderGraphs();
  } else if (currentTab === 'settings') {
    container.innerHTML = renderSettings();
  }
}

document.querySelectorAll('.nav-item').forEach((btn) => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

document.getElementById('sync-status-btn').addEventListener('click', () => switchTab('settings'));

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

render();

</script>
