<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Five By Five Lifting</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="toast-container"></div>

  <div class="app-shell">
    <header class="top-bar">
      <div>
        <h1>Five By Five Lifting</h1>
        <p>Offline-First Linear Progression Tracker</p>
      </div>
      <button id="sync-status-btn" class="sync-pill" title="Cloud Sync & Backup Settings">
        ☁️ Cloud Backup
      </button>
    </header>

    <main id="app-content" class="content"></main>

    <div id="rest-timer-container"></div>
    <div id="modal-container"></div>

    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="home">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </button>
      <button class="nav-item" data-tab="workout">
        <span class="nav-icon">🏋️</span>
        <span>Workout</span>
      </button>
      <button class="nav-item" data-tab="history">
        <span class="nav-icon">📅</span>
        <span>History</span>
      </button>
      <button class="nav-item" data-tab="graphs">
        <span class="nav-icon">📈</span>
        <span>Graphs</span>
      </button>
      <button class="nav-item" data-tab="settings">
        <span class="nav-icon">⚙️</span>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <!-- Hidden file input for restoring/merging Google Drive JSON backups -->
  <input type="file" id="restore-file-input" accept=".json,application/json" style="display:none" />

  <script src="./app.js"></script>
</body>
</html>
